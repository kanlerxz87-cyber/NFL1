name: Verify NFL source provenance

on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - ".github/workflows/verified-source-audit.yml"
      - "src/nfl/**"
      - "scripts/build_site.py"
      - "scripts/verified/check_source_audit.py"
      - "data/verified/**"
      - "data/reference/**"
      - "data/processed/site_data.json"
      - "tests/**"
      - "verified-lab/**"
  pull_request:
    paths:
      - ".github/workflows/verified-source-audit.yml"
      - "src/nfl/**"
      - "scripts/build_site.py"
      - "scripts/verified/check_source_audit.py"
      - "data/verified/**"
      - "data/reference/**"
      - "data/processed/site_data.json"
      - "tests/**"
      - "verified-lab/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfl-source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the deterministic source artifact and sub-site
        run: |
          PYTHONPATH=src python3 -m nfl.pipeline
          PYTHONPATH=src python3 scripts/build_site.py
      # Session 90c2b454-nfl1: the test package imports pandas, numpy, and the snapshot
      # parser's bs4/lxml/requests; the setup-python interpreter has none of them.
      - name: Install the test dependencies
        run: python -m pip install --quiet numpy pandas scipy requests beautifulsoup4 lxml
      - name: Run regression and table-source tests
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee /tmp/testlog.txt
          exit "${PIPESTATUS[0]}"
      - name: Publish test log to the job summary (debug)
        if: always()
        run: |
          {
            echo "## unittest log tail (session 414a54c9 debug)"
            echo '```'
            tail -60 /tmp/testlog.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the independent official-source snapshot audit
        run: PYTHONPATH=src python3 scripts/verified/check_source_audit.py
      - name: Require generated evidence to be committed
        run: git diff --exit-code -- data/processed/site_data.json verified-lab/
