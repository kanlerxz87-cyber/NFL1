name: Collect s9cb research extract (session 9cb71eb8)

# Additive to the existing `collect-data.yml` and owned by a different session, so it
# has its own workflow file and its own output directory. It only runs when files
# under `s9cb/` change, so it cannot collide with the other workflows' triggers.
#
# Runs on GitHub's infrastructure because the Arena sandbox can only reach a small
# allow-list of hosts; nflverse release assets live on release-assets.githubusercontent.com.
#
# The committed extract is deliberately small and text-only: game results with closing
# lines and prices, a filtered skill-player weekly panel, and the official weekly injury
# reports. Every file is pinned by URL + sha256 in data/s9cb/provenance.json.
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", main]
    paths:
      - "s9cb/**"
      - ".github/workflows/s9cb-collect.yml"

permissions:
  contents: write

concurrency:
  group: s9cb-collect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas numpy pyarrow requests
      - name: Syntax check
        run: python -m compileall -q s9cb
      - name: Build the research extract
        run: python s9cb/collect.py
      - name: Report what was written
        run: |
          ls -la data/s9cb/
          du -sh data/s9cb/
      - name: Commit the extract
        run: |
          git config user.name "nfl1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/s9cb
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh s9cb research extract [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
