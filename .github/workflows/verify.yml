name: Verify NFL1 site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Session 90c2b454-nfl1: the research sub-site (s9cb/site.py) imports pandas, and the
      # setup-python interpreter has none, so "Rebuild every published page" failed on main.
      - name: Install the analysis dependencies used by the sub-site builders
        run: python -m pip install --quiet numpy pandas scipy requests beautifulsoup4 lxml pyarrow
      - name: Recompute derived values
        run: python3 tools/compute_correlations.py
      - name: Re-verify merged session data line by line
        run: python3 tools/verify_combined.py
      # Session 543676f8-nfl1: the research sub-site (s9cb/site.py) imports pandas during the
      # rebuild below. Install it before the rebuild, not after (the install step further down
      # stays, unchanged, for the strength study).
      - name: Install numpy and pandas for the rebuild
        run: python -m pip install --quiet numpy pandas
      - name: Rebuild every published page from the JSON data layer
        run: python3 tools/build_site_all.py

      - name: Fail if two generators claim the same output file
        run: python3 tools/check_generators.py
      - name: Verify line by line (source links, blank values, internal links)
        run: python3 tools/verify.py
      - name: Injury scrape drift alarm (pinned counts, required fields, row-by-row vs capture)
        run: |
          python3 -m unittest tests/test_scrape_drift.py
          python3 tools/check_scrape_drift.py
      - name: Audit the published numbers against the official NFL pages
        run: python3 tools/audit_official.py
      - name: Every published page must be reachable from the landing page
        run: python3 tools/check_reachability.py
      # Session ca779bcc-nfl1. Additive: the strength-of-schedule sub-site has its own
      # hard gate (every table row source-linked, no broken local link, no placeholder
      # cell) plus unit tests, including the spread sign-convention regression that
      # caught four false PASSes during development. Nothing above is modified.
      - name: Strength study unit tests
        run: python3 -m unittest tests.test_strength -v
      - name: Rebuild the strength sub-site from its data layer
        run: python3 tools/build_strength.py
      - name: Gate the strength sub-site (source links, links, placeholders)
        run: python3 tools/check_strength_site.py
      # Session c7b65577-nfl1. Additive: the strategy-competition sub-site brings three gates
      # that are themselves tested. The pre-registration gate fails when a published backtest
      # number has no frozen rule, when the registry changed after its stamp, or when a frozen
      # rule's text no longer matches the generator. The drift alarm fails when a scraper's
      # stored artifact breaks a pin. The site gate fails on a broken link, a row with no
      # source, a placeholder cell, or a number that is not in data/strat/*.json.
      - name: Build and gate the strategy competition site
        run: |
          python3 strat/reconcile_official.py
          python3 strat/preregister.py
          python3 strat/demotion.py
          python3 strat/what_would_change.py
          python3 strat/registers.py
          python3 strat/diff.py
          python3 strat/build.py
          python3 strat/verify.py
      - name: Check pre-registration and run its self-test
        run: |
          python3 tools/stamp_preregistration.py
          python3 tools/check_preregistration.py
          python3 tools/check_preregistration.py --self-test
      - name: Scraper drift alarm and its self-test
        run: |
          python3 tools/check_scraper_pins.py
          python3 tools/check_scraper_pins.py --self-test
      - name: Strategy competition unit tests
        run: python3 -m unittest tests.test_strat_competition -v
