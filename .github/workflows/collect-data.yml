name: Collect NFL data and rebuild model outputs

# Runs on GitHub's infrastructure because the Arena sandbox can only reach a small
# allow-list of hosts (github.com, pypi.org, ...). Release assets live on
# release-assets.githubusercontent.com, which is reachable from Actions.
on:
  workflow_dispatch:
  push:
    # A branch-scoped push trigger is used instead of workflow_dispatch because
    # workflow_dispatch cannot resolve a workflow that only exists on a non-default
    # branch. Bot commits carry [skip ci] so this never loops.
    branches: ["arena/**", main]
    paths: ["pipeline/**", ".github/workflows/collect-data.yml"]
  schedule:
    - cron: "17 11 * * *"   # daily refresh, 11:17 UTC
permissions:
  contents: write

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas numpy scipy requests pyarrow beautifulsoup4 lxml
      - name: Syntax check
        run: python -m compileall -q pipeline
      - name: Collect source files (pinned URLs + sha256)
        run: python pipeline/collect.py
      - name: Scrape the official current-week injury report (nfl.com)
        run: python pipeline/scrape_injuries.py || true
      - name: Probe real schemas (no guessed column names)
        run: python pipeline/schema.py
      - name: Build model and site data
        run: |
          if [ -f pipeline/build_all.py ]; then
            python pipeline/build_all.py
          else
            echo "build_all.py not present yet"
          fi
      - name: Publish generator log
        if: always()
        run: |
          ls -la data/model/ || true

      # ---- re-render every page that prints a model number -------------------
      # Without this step the job commits refreshed JSON and the published HTML keeps the
      # previous week's numbers with no visible warning. That is the staleness defect this
      # session found on the live landing page (NE "Out 2" beside data saying "Out 1").
      - name: Re-render the model pages from the refreshed data
        run: |
          python pipeline/gen_site.py
          python tools/evidence_from_official.py
          python tools/verify_official.py
          python tools/build_decision_room.py
          python tools/build_dashboard.py
          python tools/check_freshness.py
          python tools/check_generators.py

      - name: Commit refreshed data and the pages rendered from it
        run: |
          git config user.name "nfl1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model pipeline data/evidence data/audit data/decision_room index.html pages web 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data or page changes"
            exit 0
          fi
          git commit -m "data: refresh model outputs and re-render every page [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the remote and retrying"
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 5
          done
          echo "::error::could not push the refreshed data after three attempts"
          exit 1
