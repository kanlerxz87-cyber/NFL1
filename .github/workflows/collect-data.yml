name: Collect NFL data and rebuild model outputs

# Runs on GitHub's infrastructure because the Arena sandbox can only reach a small
# allow-list of hosts (github.com, pypi.org, ...). Release assets live on
# release-assets.githubusercontent.com, which is reachable from Actions.
on:
  workflow_dispatch:
  push:
    # A branch-scoped push trigger is used instead of workflow_dispatch because
    # workflow_dispatch cannot resolve a workflow that only exists on a non-default
    # branch. Bot commits carry [skip ci] so this never loops.
    branches: ["arena/**", main]
    paths: ["pipeline/**", ".github/workflows/collect-data.yml"]
  schedule:
    - cron: "17 11 * * *"   # daily refresh, 11:17 UTC
permissions:
  contents: write

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas numpy scipy requests pyarrow beautifulsoup4 lxml
      - name: Syntax check
        run: python -m compileall -q pipeline
      - name: Collect source files (pinned URLs + sha256)
        run: python pipeline/collect.py
      - name: Scrape the official current-week injury report (nfl.com)
        run: python pipeline/scrape_injuries.py || true
      - name: Probe real schemas (no guessed column names)
        run: python pipeline/schema.py
      - name: Build model and site data
        run: |
          if [ -f pipeline/build_all.py ]; then
            python pipeline/build_all.py
          else
            echo "build_all.py not present yet"
          fi
      - name: Regenerate site HTML from refreshed data
        # build_all.py refreshes data/model/*.json, but the published site is static HTML.
        # Without this step the live pages keep the HTML built at the last merge while the
        # JSON advances daily (the [skip ci] commit below does not trigger pages.yml/verify.yml).
        # gen_site.py renders index.html + the model pages; build_site.py restores the
        # verified-session pages/lines.html it would otherwise overwrite; build_availability.py
        # renders availability.html; normalize_nav.py re-applies the shared navigation.
        run: |
          if [ -f pipeline/gen_site.py ]; then
            python pipeline/gen_site.py
          else
            echo "gen_site.py not present yet"
          fi
          if [ -f scripts/verified/build_site.py ]; then
            python scripts/verified/build_site.py
            python scripts/verified/build_availability.py
            python scripts/verified/normalize_nav.py
          else
            echo "verified site generators not present yet"
          fi
      - name: Publish generator log
        if: always()
        run: |
          ls -la data/model/ || true
      - name: Commit refreshed data
        run: |
          git config user.name "nfl1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model pipeline index.html pages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh model outputs and site from nflverse releases [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
