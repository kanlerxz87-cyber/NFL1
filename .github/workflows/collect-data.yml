name: Collect NFL data and rebuild model outputs

# Runs on GitHub's infrastructure because the Arena sandbox can only reach a small
# allow-list of hosts (github.com, pypi.org, ...). Release assets live on
# release-assets.githubusercontent.com, which is reachable from Actions.
#
# The refresh is deliberately end-to-end: it downloads the pinned source files, rebuilds the
# model outputs, rebuilds every published page from those outputs and commits the data and
# the pages together.  A page can therefore never show numbers from a snapshot that the
# repository does not also hold.
on:
  workflow_dispatch:
  push:
    # A branch-scoped push trigger is used instead of workflow_dispatch because
    # workflow_dispatch cannot resolve a workflow that only exists on a non-default
    # branch. Bot commits carry [skip ci] so this never loops.
    branches: ["arena/**", main]
    paths: ["pipeline/**", ".github/workflows/collect-data.yml"]
  schedule:
    - cron: "17 11 * * *"   # daily refresh, 11:17 UTC
permissions:
  contents: write
concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas numpy scipy requests pyarrow beautifulsoup4 lxml
      - name: Syntax check
        run: python -m compileall -q pipeline
      - name: Collect source files (pinned URLs + sha256)
        run: python pipeline/collect.py
      - name: Scrape the official current-week injury report (nfl.com)
        run: python pipeline/scrape_injuries.py
      - name: Probe real schemas (no guessed column names)
        run: python pipeline/schema.py
      - name: Build model and site data
        run: |
          if [ -f pipeline/build_all.py ]; then
            python pipeline/build_all.py
          else
            echo "build_all.py not present yet"
          fi
      - name: Report injury source actually used (including fallback)
        if: always()
        run: python pipeline/report_ingestion.py
      # 4c043747: one build script rebuilds every published page from the refreshed data
      # (supersedes the plain gen_site re-render step that used to live here).
      - name: Rebuild every published page from the refreshed data
        run: python3 tools/build_site_all.py
      # Session 6e8ca348's decision-room render + official-evidence gates, kept whole
      # during the d23c65ad takeover merge (their web/ pages are not covered by
      # build_site_all.py).
      - name: Render the decision room and verify against official pages
        run: |
          python3 tools/evidence_from_official.py
          python3 tools/verify_official.py
          python3 tools/build_decision_room.py
          python3 tools/build_dashboard.py
      - name: Publish generator log
        if: always()
        run: |
          ls -la data/model/ || true
      - name: Check every page, link, source link and freshness rule
        run: |
          python3 tools/check_committed_site.py
          python3 scripts/verified/check_site.py
          python3 tools/check_reachability.py
          python3 tools/audit_official.py
          python3 tools/check_freshness.py
          python3 tools/check_generators.py

      - name: Commit refreshed data and the rebuilt pages
        run: |
          git config user.name "nfl1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "data: refresh model outputs and rebuild the published site [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the remote and retrying"
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 5
          done
          echo "::error::could not push the refreshed data after three attempts"
          exit 1