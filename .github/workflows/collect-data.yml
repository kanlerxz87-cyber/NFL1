name: Collect NFL data and rebuild model outputs

# Runs on GitHub's infrastructure because the Arena sandbox can only reach a small
# allow-list of hosts (github.com, pypi.org, ...). Release assets live on
# release-assets.githubusercontent.com, which is reachable from Actions.
on:
  workflow_dispatch:
  push:
    # A branch-scoped push trigger is used instead of workflow_dispatch because
    # workflow_dispatch cannot resolve a workflow that only exists on a non-default
    # branch. Bot commits carry [skip ci] so this never loops.
    branches: ["arena/**", main]
    paths: ["pipeline/**", ".github/workflows/collect-data.yml"]
  schedule:
    - cron: "17 11 * * *"   # daily refresh, 11:17 UTC
permissions:
  contents: write

concurrency:
  group: collect-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pandas numpy scipy requests pyarrow beautifulsoup4 lxml
      - name: Syntax check
        run: python -m compileall -q pipeline
      - name: Collect source files (pinned URLs + sha256)
        run: python pipeline/collect.py
      - name: Scrape the official current-week injury report (nfl.com)
        run: python pipeline/scrape_injuries.py
      - name: Probe real schemas (no guessed column names)
        run: python pipeline/schema.py
      - name: Build model and site data
        run: |
          if [ -f pipeline/build_all.py ]; then
            python pipeline/build_all.py
          else
            echo "build_all.py not present yet"
          fi
      - name: Report injury source actually used (including fallback)
        if: always()
        run: python pipeline/report_ingestion.py
      # Session c56ebee8-nfl1: the 1st-to-6th string ladder joins the club depth charts to the
      # injury report that was scraped two steps above. Without this the published ladder would
      # keep last run's injury statuses while the rest of the site refreshed.
      - name: Rebuild the depth ladder from the refreshed injury report
        run: python pipeline/build_depth_ladder.py
      # Rebuild the official fixtures and refuse to publish if committed datasets disagree.
      # The canonical build below owns all page generation and navigation normalization; do not
      # call individual site generators here, or the daily refresh can publish mixed generations.
      - name: Verify official data fixtures
        run: |
          python tools/evidence_from_official.py
          python tools/verify_official.py
      - name: Rebuild every published page through the canonical site build
        run: python tools/build_site_all.py
      - name: Check freshness, generator ownership, and committed-site rules
        run: |
          python tools/check_freshness.py
          python tools/check_generators.py
          python tools/check_committed_site.py
      - name: Publish generator log
        if: always()
        run: |
          ls -la data/model/ || true
      - name: Commit refreshed data and the pages rendered from it
        run: |
          git config user.name "nfl1-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # Build output is tracked across several site roots; include changed tracked pages
          # plus the refresh's data artifacts, rather than an incomplete hand-maintained list.
          git add -u
          git add data/model pipeline data/evidence data/audit data/decision_room data/depth_ladder.json
          if git diff --cached --quiet; then
            echo "No data or page changes"
            exit 0
          fi
          git commit -m "data: refresh model outputs and re-render every page [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto the remote and retrying"
            git pull --rebase origin ${{ github.ref_name }} || true
            sleep 5
          done
          echo "::error::could not push the refreshed data after three attempts"
          exit 1
